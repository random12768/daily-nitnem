<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Nitnem</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Nitnem">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #player{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
  #offline{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
           background:#fdf6e3;color:#14305f;text-align:center;padding:24px;font-family:-apple-system,system-ui,"Noto Sans Gurmukhi",sans-serif}
  #offline h1{margin:0;font-size:34px}
  #offline p{margin:0;font-size:22px;color:#444}
  #offline button{margin-top:10px;font-size:24px;font-weight:700;padding:18px 34px;border-radius:40px;border:0;background:#1f6f5c;color:#fff}
  body.off #offline{display:flex}
  body.off #player{display:none}
</style>
</head>
<body>
<iframe id="player"
  src="https://www.youtube-nocookie.com/embed/mWCl7mol8BE?playsinline=1&rel=0&modestbranding=1&start=0"
  title="Nitnem"
  allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
  allowfullscreen
  referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div id="offline">
  <h1>ਇੰਟਰਨੈੱਟ ਚਾਹੀਦਾ ਹੈ</h1>
  <p>Internet needed to play the video</p>
  <button id="retry">ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ · Try again</button>
</div>

<script>
(function(){
  function check(){ document.body.classList.toggle("off", !navigator.onLine); }
  window.addEventListener("offline", check);
  window.addEventListener("online", function(){ check(); if(!document.body.classList.contains("off")) location.reload(); });
  document.getElementById("retry").addEventListener("click", function(){ location.reload(); });
  check();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js"); }
})();
</script>
</body>
</html>
